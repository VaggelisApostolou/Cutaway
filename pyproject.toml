[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutaway"
version = "0.1.0"
description = "Personalised, auto-produced football highlight reels from synthetic match data"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "agent-framework-core>=1.22",
    "agent-framework-openai>=1.17",
    "openai>=1.60",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
